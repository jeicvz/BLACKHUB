<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - The Black Studio</title>
    <link rel="icon" href="/images/logoblack.png" type="image/png">
    
    <!-- FUENTES: NEW ROCKER (TÍTULO) Y OSWALD (LABELS/BOTONES) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- AQUÍ SE CARGA EL ÚNICO ARCHIVO DE ESTILOS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <main class="login-wrapper flex-center" id="registro-wrapper">
        <div class="login-card">
            
            <div class="text-center">
                <img src="/images/logoblack.png" alt="Logo The Black Studio" class="login-logo">
                <h2 class="login-title-metal">CREAR CUENTA</h2>
            </div>
            
            <form id="formRegistro">
                
                <!-- Fila de Nombre y Apellido -->
                <div class="mb-3 flex-row">
                    <div class="flex-col text-left">
                        <label for="nombre" class="form-label-custom">Nombre</label>
                        <div class="input-group">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                            <input type="text" class="custom-input" id="nombre" placeholder="Tu nombre" required>
                        </div>
                    </div>
                    <div class="flex-col text-left">
                        <label for="apellido" class="form-label-custom">Apellido</label>
                        <div class="input-group">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                            <input type="text" class="custom-input" id="apellido" placeholder="Tu apellido" required>
                        </div>
                    </div>
                </div>
                
                <!-- Correo Electrónico -->
                <div class="mb-3 text-left">
                    <label for="correo" class="form-label-custom">Correo Electrónico</label>
                    <div class="input-group">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        <input type="email" class="custom-input" id="correo" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>
                
                <!-- Contraseña -->
                <div class="mb-4 text-left">
                    <label for="password" class="form-label-custom">Contraseña</label>
                    <div class="input-group">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        <input type="password" class="custom-input" id="password" placeholder="••••••••" required>
                        <svg class="toggle-password" id="togglePassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </div>
                </div>
                
                <!-- Botones de Acción -->
                <div class="buttons-row">
                    <a href="/index.html" class="btn-silver btn-back btn-row">ATRÁS</a>
                    <button type="submit" class="btn-silver gold-hover btn-row">REGISTRARSE</button>
                </div>
            </form>

            <!-- Texto inferior bien separado -->
            <div class="text-center mt-5">
                <span style="color: #ffffff; font-family: 'Oswald', sans-serif;">
                    ¿Ya tienes cuenta? <a href="/login.html" class="register-link">Inicia sesión aquí</a>
                </span>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/main.js"></script>

    <!-- Script del Ojo de Contraseña -->
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            if (type === 'text') {
                togglePassword.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                `;
            } else {
                togglePassword.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                `;
            }
        });
    </script>
</body>
</html>
