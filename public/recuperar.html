<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - The Black Studio</title>
    <link rel="icon" href="/images/logoblack.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=New+Rocker&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <main class="login-wrapper flex-center">
        <div class="login-card recuperar-card">
            
            <div class="text-center">
                <img src="/images/logoblack.png" alt="Logo The Black Studio" class="login-logo">
                <h2 class="login-title-metal">RECUPERAR</h2>
                <p class="recuperar-desc">
                    Ingresa tu correo registrado y escribe una nueva contraseña.
                </p>
            </div>
            
            <form id="formRecuperarPassword">
                <div class="mb-4 text-left">
                    <label for="correoRecuperar" class="form-label-custom">Correo Electrónico</label>
                    <div class="input-group">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        <input type="email" class="custom-input" id="correoRecuperar" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>

                <div class="mb-4 text-left">
                    <label for="nuevaPassword" class="form-label-custom">Nueva Contraseña</label>
                    <div class="input-group">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        <input type="password" class="custom-input" id="nuevaPassword" placeholder="Nueva contraseña" required>
                    </div>
                </div>

                <div class="mb-5 text-left">
                    <label for="confirmarPassword" class="form-label-custom">Confirmar Contraseña</label>
                    <div class="input-group">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <input type="password" class="custom-input" id="confirmarPassword" placeholder="Repite la contraseña" required>
                    </div>
                </div>
                
                <div class="buttons-row">
                    <a href="/login.html" class="btn-silver btn-back btn-row">ATRÁS</a>
                    <button type="submit" class="btn-silver gold-hover btn-row">ACTUALIZAR</button>
                </div>
            </form>

            <div class="text-center mt-5">
                <span style="color: #ffffff; font-family: 'Oswald', sans-serif;">
                    ¿Ya tienes cuenta? <a href="/login.html" class="register-link">Inicia sesión aquí</a>
                </span>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/main.js"></script>
</body>
</html>
